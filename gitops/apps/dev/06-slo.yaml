apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: slo-rules-dev
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "2" }   # after prometheus CRDs exist
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: dev
  source:
    repoURL: "https://github.com/CHANGE-ME/retail-platform-poc.git"
    targetRevision: main
    path: gitops/observability
  destination: { server: https://kubernetes.default.svc, namespace: monitoring }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
