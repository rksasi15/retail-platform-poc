# ui — DEV overlay
nameOverride: ui
image:
  repository: public.ecr.aws/aws-containers/retail-store-sample-ui
  tag: ""
  digest: "sha256:37507f4c0fa77ccff4c228b0eaa552b26e8d6ff91254ea485fe84a0048984e83"
  pullPolicy: IfNotPresent
replicaCount: 2
containerPort: 8080
service: { type: ClusterIP, port: 80 }
ingress:
  enabled: true
  className: nginx
  host: dev.retail.example.com
  path: /
  pathType: Prefix
  clusterIssuer: retail-ca-issuer
  tls: true
probes:
  liveness:  { path: /actuator/health/liveness, port: 8080, initialDelaySeconds: 45, periodSeconds: 10 }
  readiness: { path: /actuator/health/readiness, port: 8080, initialDelaySeconds: 20, periodSeconds: 10 }
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits:   { cpu: 500m, memory: 256Mi }
autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 5, targetCPUUtilizationPercentage: 70, targetMemoryUtilizationPercentage: 80 }
pdb: { enabled: true, minAvailable: 1 }
