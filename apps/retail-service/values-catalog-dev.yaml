# catalog — DEV overlay
nameOverride: catalog
image:
  repository: public.ecr.aws/aws-containers/retail-store-sample-catalog
  tag: "1.2.0"           # dev may use tags; stage/prod MUST use digest (Kyverno-enforced)
  pullPolicy: IfNotPresent
replicaCount: 2
containerPort: 8080
service: { type: ClusterIP, port: 80 }
ingress:
  enabled: true
  className: nginx
  host: dev.retail.example.com
  path: /catalog
  pathType: Prefix
  clusterIssuer: retail-ca-issuer
  tls: true
probes:
  liveness:  { path: /health, port: 8080, initialDelaySeconds: 20, periodSeconds: 10 }
  readiness: { path: /health, port: 8080, initialDelaySeconds: 10, periodSeconds: 10 }
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits:   { cpu: 500m, memory: 256Mi }
autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 5, targetCPUUtilizationPercentage: 70, targetMemoryUtilizationPercentage: 80 }
pdb: { enabled: true, minAvailable: 1 }
